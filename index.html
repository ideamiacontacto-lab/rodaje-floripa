<style>
/* Layout: phone-first field tool. Sticky header with day strip, one view at a time, big tick boxes. Ideamia black + yellow. */
:root{
  --bg:#FFFFFF; --ink:#0B0B0A; --muted:#6B6A63; --line:#E6E5DF; --panel:#F3F3EF;
  --y:#F9E92D; --on-y:#0B0B0A; --f:#0B0B0A; --on-f:#F9E92D; --h:#2B5FE8; --on-h:#FFFFFF;
  --done:#1E8E4E; --foto:#C2185B;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0C; --ink:#F2F2EE; --muted:#9C9B93; --line:#2A2A27; --panel:#181816;
  --f:#F9E92D; --on-f:#0B0B0A; --h:#6F98FF; --on-h:#0B0B0A; --done:#4CC983; --foto:#FF6FA8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0C; --ink:#F2F2EE; --muted:#9C9B93; --line:#2A2A27; --panel:#181816;
  --f:#F9E92D; --on-f:#0B0B0A; --h:#6F98FF; --on-h:#0B0B0A; --done:#4CC983; --foto:#FF6FA8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--h);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.top svg{height:38px;width:auto;flex:0 0 auto}
.top .ttl{min-width:0}
.top .ttl b{display:block;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.top .ttl span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sync{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.ok i{background:var(--done)}
nav{overflow-x:auto;scrollbar-width:none;padding-block:4px 10px}
nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;width:max-content}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center;min-width:52px;line-height:1.15;text-decoration:none;color:inherit}
.tab small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:600;text-transform:uppercase}
.tab b{font-family:var(--display);font-weight:800;font-size:17px}
.tab.sec{display:flex;align-items:center}
.tab.sec b{font-size:14px;font-weight:700}
.tab .bar{height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.tab .bar i{display:block;height:100%;background:var(--done)}
.tab[aria-current="page"]{background:var(--y);border-color:var(--y);color:var(--on-y)}
.tab[aria-current="page"] small{color:var(--on-y)}
.tab.today:not([aria-current="page"]){border-color:var(--ink)}
.sep{width:1px;background:var(--line);margin:4px}
main{padding-block:20px 80px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1;letter-spacing:-.025em;margin:6px 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:21px;margin:28px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .hr{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:0 0 14px}
.agenda{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.agenda div{padding:12px 14px;min-width:0}
.agenda div+div{border-left:1.5px solid var(--ink)}
.agenda .k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:2px}
.agenda b{font-weight:700;font-size:17px;line-height:1.25}
.goal{background:var(--y);color:var(--on-y);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:16px;font-weight:500}
.goal .eyebrow{color:var(--on-y);opacity:.75;display:block;margin-bottom:2px}
.feeds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.c{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.c.rt{background:var(--y);border-color:var(--y);color:var(--on-y)}
.c.foto{background:transparent;border:1.5px solid var(--foto);color:var(--foto)}
.c.on{outline:2px solid var(--ink);outline-offset:1px}
.who{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:20px;white-space:nowrap}
.who.F{background:var(--f);color:var(--on-f)}
.who.H{background:var(--h);color:var(--on-h)}
.who.E{background:var(--y);color:var(--on-y)}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.prog{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.prog b{color:var(--ink)}
.fnote{font-size:13px;color:var(--muted);margin-top:6px}
.fnote button{border:0;background:none;text-decoration:underline;cursor:pointer;color:var(--ink);padding:0}
.list{border-top:1.5px solid var(--ink)}
.shot{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.shot input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2.5px solid var(--ink);border-radius:7px;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--bg)}
.shot input:checked{background:var(--done);border-color:var(--done)}
.shot input:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.shot .t{min-width:0;font-size:16.5px;font-weight:600}
.shot .t small{display:block;color:var(--muted);font-size:14.5px;font-weight:400;margin-top:3px;line-height:1.45}
.shot.done .t>span{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.shot.isfoto .t>span::before{content:"FOTO";font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--foto);border:1.5px solid var(--foto);border-radius:4px;padding:0 4px;margin-right:7px;vertical-align:2px}
.shot .m{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:240px}
.shot .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:14px 0}
.shot .t small.ex{font-size:13.5px;color:var(--ink);font-weight:500;margin-top:4px}
.shot .t small.ex b{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:4px;margin-right:7px;vertical-align:1px}
.shot .t small.ref{font-size:13px;font-style:italic;color:var(--muted);border-left:3px solid var(--y);padding-left:8px;margin-top:6px}
.angles{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.angles span{flex-basis:100%;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.angles i{font-style:normal;font-size:13px;font-weight:600;border:1.5px solid var(--ink);border-radius:20px;padding:2px 9px}
.roles{padding-block:2px 6px}
.roles .seg{display:flex;width:100%}
.roles .seg button{flex:1;padding:9px 8px;font-size:14.5px}
.shot .t small.para{font-family:var(--mono);font-size:12px;color:var(--ink);opacity:.85;margin-top:6px;letter-spacing:.01em}
.shot .t small.para b{background:var(--y);color:var(--on-y);padding:1px 5px;border-radius:4px;font-weight:500;margin-right:4px;display:inline-block;margin-bottom:3px}
.shot .t small.para i{font-style:normal;background:var(--panel);border:1px solid var(--line);padding:0 5px;border-radius:4px;margin-right:4px;display:inline-block;margin-bottom:3px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:14px}
.count b{color:var(--ink)}
.ed{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;margin-top:18px}
.ed .eyebrow{color:var(--bg);opacity:.7;display:block;margin-bottom:4px}
.eq{font-size:14.5px;color:var(--muted);margin-top:14px}
.eq b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;color:var(--ink);margin-right:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--panel);color:var(--ink);resize:vertical}
.saved{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;background:var(--bg)}
.card h3{font-family:var(--display);font-weight:800;font-size:18px;margin:6px 0 4px}
.card p{margin:0;font-size:15px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.dark p{color:var(--bg);opacity:.8}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--done)}
.mtext{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.card button.link{border:0;background:none;padding:0;margin-top:8px;cursor:pointer;font-weight:700;font-size:14px;text-decoration:underline}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 6px;border-bottom:1.5px solid var(--ink)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono,th.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mx td,.mx th{text-align:center;padding:7px 4px}
.mx td:first-child,.mx th:first-child{text-align:left;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ink)}
.dot.l{background:transparent;border:2px solid var(--ink)}
.dot.r{background:var(--y);border:2px solid var(--ink);width:17px;height:17px}
.rt{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.rt .n{width:54px;height:54px;border-radius:50%;background:var(--y);color:var(--on-y);display:grid;place-content:center;font-family:var(--display);font-weight:800;font-size:15px}
.rt h3{margin:0;font-family:var(--display);font-weight:800;font-size:19px}
.rt p{margin:2px 0 8px;color:var(--muted);font-size:15px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer;background:var(--panel)}
.step input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;margin:0;display:grid;place-content:center;cursor:pointer;background:var(--bg)}
.step input:checked{background:var(--done);border-color:var(--done)}
.step input:checked::after{content:"";width:8px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg)}
.tl{display:flex;flex-direction:column;margin-top:8px}
.blk{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.blk .h{font-family:var(--mono);font-size:13px;font-weight:500}
.blk p{margin:0;font-size:15px}
.blk p small{display:block;color:var(--muted)}
@media (max-width:560px){
  .agenda{grid-template-columns:1fr}
  .agenda div+div{border-left:0;border-top:1.5px solid var(--ink)}
  .shot{grid-template-columns:32px 1fr}
  .shot .m{grid-column:2;justify-content:flex-start;max-width:none}
  .blk{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:no-preference){.meter i,.tab .bar i{transition:width .3s ease}}
</style>

function devOf(x){if(!x)return null;var e=x.eq,st=x.st;

  if(/Mini 4 Pro/.test(e))return "Drone";if(/Osmo/.test(e))return "Osmo Pocket";if(/Ace Pro/.test(e))return "Ace Pro 2";if(/Mic 2/.test(e))return "Micrófono";if(/A7 IV|a6700/.test(e))return "Cámara principal";return null}

  '<div class="card"><div class="row"><h3>Fotógrafo · Híbrido</h3></div><p>Todo el banco de fotos con A7 IV y a6700. Además drone, Ace Pro 2 y Osmo: POV, vlog, aéreas y retratos en cámara lenta.</p></div>'+
  '<div class="card"><div class="row"><h3>Editor</h3></div><p>A distancia. Monta cada Real-Time en 24/48 h y lo envía al cliente. Después edita las piezas finales.</p></div>'+
  '<div class="card"><h3>Coordinadores WhyNot</h3><p>Avisan horarios, accesos y cambios. Pedir uno de referencia el primer día.</p></div></div>';
}

function viewPend(){
  return '<div class="eyebrow">Con el itinerario definitivo</div><h1>A confirmar</h1><p class="lead">Tildá cada punto cuando esté resuelto y anotá la respuesta en las notas del día que corresponda.</p><div class="list">'+
   PEND.map(function(p){var id="pe-"+p[0],on=!!checks[id];return '<div class="shot'+(on?" done":"")+'"><input type="checkbox" id="ck-'+id+'" data-ck="'+id+'"'+(on?" checked":"")+'><label class="t" for="ck-'+id+'"><span>'+esc(p[1])+'</span><small>'+esc(p[2])+'</small></label><div></div></div>'}).join("")+'</div>';
}

/* ---------- ROUTER / RENDER ---------- */
function viewInfo(){
  function sub(s){return s.replace(/<h1>/g,'<h2 style="font-size:28px;margin-top:44px">').replace(/<\/h1>/g,'</h2>')}
  return '<div class="eyebrow">Para tener a mano</div><h1>Info del rodaje</h1><p class="lead">Todo se graba en horizontal 16:9. Las actividades arrancan al mediodía y las fiestas terminan entre las 4 y las 5. El trabajo de cada día está en su pestaña: elegí tu rol arriba.</p>'+
  '<div class="scroll"><table><tr><th class="mono">Día</th><th>De día</th><th>De noche</th></tr>'+
  DAYS.map(function(d){return '<tr><td class="mono"><a href="#'+d.id+'">'+d.wd+' '+d.dm+'</a></td><td>'+esc(d.dia)+'</td><td>'+esc(d.noche)+'</td></tr>'}).join("")+'</table></div>'+
  '<h2 style="font-size:28px;margin-top:44px">Cámaras chicas y ángulos</h2><p class="lead">Cada actividad se cubre desde varios lugares a la vez: cámara principal, fotos, drone, Ace Pro 2 y Osmo Pocket. La Ace y la Osmo pueden quedar en manos de pasajeros o coordinadores.</p><div class="grid">'+
   '<div class="card"><h3>Ace Pro 2 en el stick</h3><p>Stick extendido por encima de las cabezas: el grupo desde arriba, como un drone bajo. Sirve en la pista, la pileta y caminatas. Con la Ace el palo puede verse: encuadrar para dejarlo afuera o en el borde.</p></div>'+
   '<div class="card"><h3>Ace Pro 2 en el pecho o en el agua</h3><p>Con la pechera, POV en toboganes y sandboard. Es sumergible: bajo el agua en la pileta o mitad agua y mitad aire en el mar.</p></div>'+
   '<div class="card"><h3>Timelapse</h3><p>Ace Pro 2 fija en un lugar alto durante 10–20 minutos al llegar a cada lugar: el buffet, el salón llenándose, la pileta, el atardecer. Después se retira y pasa al híbrido.</p></div>'+
   '<div class="card"><h3>Osmo Pocket en manos de alguien</h3><p>Un pasajero o coordinador se graba en modo vlog: el desayuno, su habitación, el antes y después de We Color, la previa de la gala. No es sumergible.</p></div>'+
   '<div class="card dark"><h3>Si le das una cámara a alguien</h3><p>Elegí a alguien confiable (mejor un coordinador). Explicale 3 cosas: horizontal, tomas de 10–20 segundos, no tapar el lente. Correa en la muñeca. Recuperala al terminar la actividad y se descarga esa noche.</p></div>'+
   '<div class="card"><h3>Una sola Ace Pro 2</h3><p>No se puede usar para dos cosas a la vez. Orden habitual: timelapse al llegar, después stick o pechera. Revisá en cada día quién la tiene.</p></div>'+
  '</div>'+
  sub(viewRT())+sub(viewRutina())+sub(viewEstilo())+sub(viewPend());
}
function current(){var h=(location.hash||"").slice(1);if(h!=="info"&&!DAYS.some(function(d){return d.id===h})){h=todayId()||"d29"}return h}
function renderTabs(cur){
  var t=todayId();
  document.getElementById("roles").innerHTML=roleBar();
  document.getElementById("tabs").innerHTML='<a class="tab sec" href="#info"'+(cur==="info"?' aria-current="page"':'')+'><b>Info</b></a><span class="sep"></span>'+
   DAYS.map(function(d){var p=prog(d.shots.filter(visible));return '<a class="tab'+(d.id===t?" today":"")+'" href="#'+d.id+'"'+(cur===d.id?' aria-current="page"':'')+'><small>'+d.wd+'</small><b>'+d.dm.slice(0,2)+'</b><div class="bar"><i style="width:'+p.pct+'%"></i></div></a>'}).join("");
}
function render(mode){
  var cur=current(),v=document.getElementById("view"),y=window.scrollY;
  var ta=document.activeElement&&document.activeElement.tagName==="TEXTAREA";
  if(ta&&mode==="remote")return;
  renderTabs(cur);
  var d=DAYS.filter(function(x){return x.id===cur})[0];
  v.innerHTML=d?viewDay(d):viewInfo();
  if(mode)window.scrollTo(0,y);
  else{var act=document.querySelector('.tab[aria-current="page"]');if(act)act.scrollIntoView({block:"nearest",inline:"center"})}
}
window.addEventListener("hashchange",function(){render(false);window.scrollTo(0,0)});
document.addEventListener("change",function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-ck");if(id)toggle(id,e.target.checked)});
document.addEventListener("input",function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-note");if(id)saveNote(id,e.target.value)});
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("[data-who]");if(!t)return;
  ui.who=t.getAttribute("data-who");lsSet("ui",ui);render(true);
});

/* ---------- BOOT ---------- */
checks=lsGet("checks",{});notes=lsGet("notes",{});
setSync(false,"Solo en este dispositivo");
render(false);
if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(d){
    if(!d){setSync(false,"Solo en este dispositivo");return}
    db=d;setSync(false,"Conectando…");
    var timer=setTimeout(function(){setSync(false,"Sin conexión: puede estar desactualizado")},10000);
    var gotC=false,gotN=false;
    function ready(){if(gotC&&gotN){clearTimeout(timer);setSync(true,"Compartido en vivo")}}
    db.collection("checks").onSnapshot(function(snap){
      var c={};snap.docs.forEach(function(doc){var x=doc.data();if(x&&x.v)c[doc.id]=true});checks=c;
      if(!snap.metadata.fromCache){gotC=true;ready()}
      render("remote");
    },function(){clearTimeout(timer);setSync(false,"Sin sincronizar")});
    db.collection("notes").onSnapshot(function(snap){
      snap.docs.forEach(function(doc){var x=doc.data();var el=document.getElementById("note-"+doc.id);if(!(el&&document.activeElement===el)){notes[doc.id]=(x&&x.text)||""}});
      if(!snap.metadata.fromCache){gotN=true;ready()}
      render("remote");
    },function(){});
  }).catch(function(){setSync(false,"Solo en este dispositivo")});
}
})();
</script>
